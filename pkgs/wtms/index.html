<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Water tank - miniesp</title><link rel="stylesheet" href="tank.css"></head><body>

<symbol id="i-droplet" viewBox="0 0 24 24"><path d="M12 3c3.5 4.2 6 7 6 10.2A6 6 0 0 1 6 13.2C6 10 8.5 7.2 12 3z"/></symbol>
<symbol id="i-activity" viewBox="0 0 24 24"><path d="M3 12h4l3-8 4 16 3-8h4"/></symbol>
<symbol id="i-server" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="7" rx="2"/><rect x="3" y="13" width="18" height="7" rx="2"/><path d="M7 7.5h.01M7 16.5h.01"/></symbol>
<symbol id="i-package" viewBox="0 0 24 24"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9L12 3z"/><path d="M4 7.5l8 4.5 8-4.5M12 12v9"/></symbol>
<symbol id="i-power" viewBox="0 0 24 24"><path d="M12 3v8M6.3 7a8 8 0 1 0 11.4 0"/></symbol>
<symbol id="i-sliders" viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></symbol>
<symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
<symbol id="i-cpu" viewBox="0 0 24 24"><rect x="5" y="5" width="14" height="14" rx="2"/><rect x="9" y="9" width="6" height="6" rx="1"/><path d="M9 2v3M15 2v3M9 19v3M15 19v3M2 9h3M2 15h3M19 9h3M19 15h3"/></symbol>
<symbol id="i-globe" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.6 2.6 3.9 5.6 3.9 9s-1.3 6.4-3.9 9c-2.6-2.6-3.9-5.6-3.9-9s1.3-6.4 3.9-9z"/></symbol>
<symbol id="i-wifi" viewBox="0 0 24 24"><path d="M2.5 9a14 14 0 0 1 19 0M5.8 12.5a9.5 9.5 0 0 1 12.4 0M9 16a5 5 0 0 1 6 0"/><circle cx="12" cy="19.5" r=".9"/></symbol>
<symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></symbol>
<symbol id="i-save" viewBox="0 0 24 24"><path d="M5 3h11l3 3v15H5V3z"/><path d="M8 3v5h7V3M8 21v-6h8v6"/></symbol>
</defs></svg>
<header class="top"><div class="bar">
 <a class="brand" href="/" aria-label="miniesp">
  <svg class="logo" viewBox="0 0 64 64" width="28" height="28" aria-hidden="true"><g class="pins"><rect x="21" y="3" width="4" height="9" rx="2"/><rect x="30" y="3" width="4" height="9" rx="2"/><rect x="39" y="3" width="4" height="9" rx="2"/><rect x="21" y="52" width="4" height="9" rx="2"/><rect x="30" y="52" width="4" height="9" rx="2"/><rect x="39" y="52" width="4" height="9" rx="2"/><rect x="3" y="21" width="9" height="4" rx="2"/><rect x="3" y="30" width="9" height="4" rx="2"/><rect x="3" y="39" width="9" height="4" rx="2"/><rect x="52" y="21" width="9" height="4" rx="2"/><rect x="52" y="30" width="9" height="4" rx="2"/><rect x="52" y="39" width="9" height="4" rx="2"/></g><rect class="body" x="12" y="12" width="40" height="40" rx="7"/><path class="chev" d="M22 23l11 9-11 9" fill="none" stroke-width="4.5"/><rect x="35" y="39" width="11" height="4.5" fill="#f97316"/></svg>
  <span>mini<b>esp</b></span></a>
 <nav class="mtabs" aria-label="Console">
  <a href="/#machine"><svg class="ic"><use href="#i-server"/></svg>Machine</a>
  <a href="/#services"><svg class="ic"><use href="#i-activity"/></svg>Services</a>
  <a href="/#apps" aria-current="page"><svg class="ic"><use href="#i-package"/></svg>Apps</a>
 </nav>
</div></header>
<main class="wrap">
<div class="head"><div class="tile"><svg class="ic" style="width:24px;height:24px"><use href="#i-droplet"/></svg></div>
 <div><h1>Water tank</h1><div class="sub"><span class="dot" id="hdot"></span> <span id="hstate">Loading</span></div></div>
 <nav class="menu" id="menu"><a href="index.html" class="cur">Dashboard</a><a href="login.html" id="lg">Log in</a></nav></div>
<div class="cols">
 <div class="stack">
  <div class="card"><h2><svg class="ic"><use href="#i-droplet"/></svg>Level</h2>
   <div class="gauge"><div class="tankv"><div class="fill" id="fill"></div><div class="mark" id="mon"></div><div class="mark" id="moff"></div><div class="pct" id="pct">--</div></div>
    <dl class="kv"><dt>Volume</dt><dd id="l">--</dd><dt>Pump</dt><dd><span class="pill" id="pump">--</span></dd><dt>Mode</dt><dd id="mode">--</dd><dt>Fault</dt><dd><span class="pill on" id="fault">--</span></dd></dl></div>
   <div class="sub" id="ts" style="margin-top:12px">--</div></div>
  <div class="card" id="ctl" style="display:none"><h2><svg class="ic"><use href="#i-power"/></svg>Pump control</h2><div id="ctlbox"></div></div>
  <div class="card" id="guest"><h2><svg class="ic"><use href="#i-power"/></svg>Pump control</h2><div class="sub">Log in to force the pump on/off or change settings.</div><div class="btns"><a class="b" href="login.html?next=index.html" style="text-align:center;text-decoration:none">Log in</a></div></div>
 </div>
 <div class="stack">
  <div class="stats"><div class="stat"><b id="s1">--</b><span>Sensor distance</span></div><div class="stat"><b id="s2">--</b><span>Start / stop levels</span></div><div class="stat"><b id="s3">--</b><span>Temperature</span></div><div class="stat"><b id="s4">--</b><span>Pump runs (shown range)</span></div></div>
  <div class="card"><h2><svg class="ic"><use href="#i-activity"/></svg>History</h2>
   <div class="tabs" id="tabs"><button data-h="6">6 h</button><button data-h="24" class="cur">24 h</button><button data-h="168">7 days</button><button data-h="0">All</button></div>
   <canvas id="chart"></canvas><div class="sub" id="range"></div></div>
 </div>
</div></main>
<script src="tank.js"></script>
<script>
let last=null,rows=[],hours=24;
function render(s){
  last=s;
  $('fill').style.height=s.level+'%'; $('pct').textContent=Math.round(s.level)+'%';
  $('mon').style.bottom=s.on_pct+'%'; $('moff').style.bottom=s.off_pct+'%';
  $('l').textContent=s.litres+' / '+s.vol+' L';
  $('pump').textContent=s.pump+(s.force&&s.force!=='none'?' (forced)':''); $('pump').className='pill '+(s.pump==='ON'?'on':'');
  $('mode').textContent=s.force==='on'?'Forced ON':s.force==='off'?'Forced OFF':s.auto==='ON'?'Automatic':'Auto off';
  $('fault').textContent=s.fault; $('fault').className='pill '+(s.fault==='none'?'on':'bad');
  $('hdot').className='dot '+(s.fault==='none'?'ok':'bad'); $('hstate').textContent=s.fault!=='none'?'Fault: '+s.fault:s.pump==='ON'?'Pump running':'Idle';
  $('s1').textContent=s.distance_cm+' cm'; $('s2').textContent=s.on_pct+'% / '+s.off_pct+'%'; $('s3').textContent=(s.temp&&+s.temp!==0)?s.temp+' °C':'—';
  const age=s.ts?Math.round(Date.now()/1000-s.ts):0;
  $('ts').textContent=s.ts?'Updated '+new Date(s.ts*1000).toLocaleString()+(age>120?'  — STALE: the controller has not reported for '+Math.round(age/60)+' min':''):'Clock not set';
  T.showForce&&T.showForce(s);
}
async function state(){ try{render(await (await fetch('state.json?'+Date.now())).json())}catch(e){$('ts').textContent='No data yet.'} }
async function csv(u){try{const r=await fetch(u+'?'+Date.now());if(!r.ok)return[];return (await r.text()).trim().split('\n').map(l=>l.split(',').map(Number)).filter(a=>a.length>=4&&a[0]>1e9)}catch(e){return[]}}
async function hist(){ rows=(await csv('history.old.csv')).concat(await csv('history.csv')); draw() }
function draw(){
  const c=$('chart'),dpr=window.devicePixelRatio||1,W=c.clientWidth,H=c.clientHeight; c.width=W*dpr;c.height=H*dpr;
  const g=c.getContext('2d'); g.scale(dpr,dpr); g.clearRect(0,0,W,H);
  const css=getComputedStyle(document.documentElement),mute=css.getPropertyValue('--mute'),line=css.getPropertyValue('--line'),water=css.getPropertyValue('--water'),ok=css.getPropertyValue('--ok');
  let d=rows; if(hours&&d.length){const t1=d[d.length-1][0];d=d.filter(r=>r[0]>=t1-hours*3600)}
  const L=34,R=8,Tp=8,B=22,pw=W-L-R,ph=H-Tp-B;
  g.font='12px system-ui';g.fillStyle=mute;g.strokeStyle=line;g.lineWidth=1;
  for(const p of [0,25,50,75,100]){const y=Tp+ph*(1-p/100);g.beginPath();g.moveTo(L,y);g.lineTo(W-R,y);g.stroke();g.textAlign='right';g.fillText(p+'%',L-5,y+4)}
  if(d.length<2){g.textAlign='center';g.fillText('Not enough history yet',W/2,H/2);$('range').textContent='';$('s4').textContent='—';return}
  const t0=d[0][0],t1=d[d.length-1][0],x=t=>L+(t-t0)/(t1-t0||1)*pw,y=p=>Tp+ph*(1-p/1000);
  g.fillStyle=ok+'33'; let runs=0,inrun=false;                      // shade pump runs
  for(let i=0;i<d.length;i++){ if(d[i][3]){ if(!inrun){runs++;inrun=true} const xa=x(d[i][0]),xb=i+1<d.length?x(d[i+1][0]):xa+2; g.fillRect(xa,Tp,Math.max(2,xb-xa),ph) } else inrun=false }
  if(last){g.setLineDash([5,4]);g.strokeStyle=mute;for(const p of [last.on_pct,last.off_pct]){const yy=y(p*10);g.beginPath();g.moveTo(L,yy);g.lineTo(W-R,yy);g.stroke()}g.setLineDash([])}
  g.strokeStyle=water;g.lineWidth=2;g.lineJoin='round';g.beginPath(); d.forEach((r,i)=>i?g.lineTo(x(r[0]),y(r[1])):g.moveTo(x(r[0]),y(r[1]))); g.stroke();
  g.fillStyle=mute;g.textAlign='left';
  const f=t=>new Date(t*1000).toLocaleString([], hours&&hours<=24?{hour:'2-digit',minute:'2-digit'}:{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'});
  g.fillText(f(t0),L,H-5);g.textAlign='right';g.fillText(f(t1),W-R,H-5);
  $('range').textContent='Green = pump running, dashed = start/stop levels';$('s4').textContent=runs;
}
$('tabs').onclick=e=>{ if(e.target.dataset.h===undefined)return; hours=+e.target.dataset.h; for(const b of $('tabs').children)b.classList.toggle('cur',b===e.target); draw() };
addEventListener('resize',()=>draw());
(async()=>{
  state();hist();setInterval(state,10000);setInterval(hist,120000);
  T.noRedirect=true;
  if(await T.loggedIn()){
    $('ctl').style.display='';$('guest').style.display='none';
    T.mountControls($('ctlbox'),s=>{render(s)});
    $('lg').outerHTML='<a href="config.html">Settings</a><button onclick="T.logout()">Log out</button>';
  }
})();
</script></body></html>
