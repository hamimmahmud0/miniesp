<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sign in - Water tank - miniesp</title><link rel="stylesheet" href="tank.css"></head><body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<symbol id="i-droplet" viewBox="0 0 24 24"><path d="M12 3c3.5 4.2 6 7 6 10.2A6 6 0 0 1 6 13.2C6 10 8.5 7.2 12 3z"/></symbol>
<symbol id="i-activity" viewBox="0 0 24 24"><path d="M3 12h4l3-8 4 16 3-8h4"/></symbol>
<symbol id="i-server" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="7" rx="2"/><rect x="3" y="13" width="18" height="7" rx="2"/><path d="M7 7.5h.01M7 16.5h.01"/></symbol>
<symbol id="i-package" viewBox="0 0 24 24"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9L12 3z"/><path d="M4 7.5l8 4.5 8-4.5M12 12v9"/></symbol>
<symbol id="i-power" viewBox="0 0 24 24"><path d="M12 3v8M6.3 7a8 8 0 1 0 11.4 0"/></symbol>
<symbol id="i-sliders" viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></symbol>
<symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
<symbol id="i-cpu" viewBox="0 0 24 24"><rect x="5" y="5" width="14" height="14" rx="2"/><rect x="9" y="9" width="6" height="6" rx="1"/><path d="M9 2v3M15 2v3M9 19v3M15 19v3M2 9h3M2 15h3M19 9h3M19 15h3"/></symbol>
<symbol id="i-globe" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.6 2.6 3.9 5.6 3.9 9s-1.3 6.4-3.9 9c-2.6-2.6-3.9-5.6-3.9-9s1.3-6.4 3.9-9z"/></symbol>
<symbol id="i-wifi" viewBox="0 0 24 24"><path d="M2.5 9a14 14 0 0 1 19 0M5.8 12.5a9.5 9.5 0 0 1 12.4 0M9 16a5 5 0 0 1 6 0"/><circle cx="12" cy="19.5" r=".9"/></symbol>
<symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></symbol>
<symbol id="i-save" viewBox="0 0 24 24"><path d="M5 3h11l3 3v15H5V3z"/><path d="M8 3v5h7V3M8 21v-6h8v6"/></symbol>
</defs></svg>
<header class="top"><div class="bar">
 <a class="brand" href="/" aria-label="miniesp">
  <svg class="logo" viewBox="0 0 64 64" width="28" height="28" aria-hidden="true"><g class="pins"><rect x="21" y="3" width="4" height="9" rx="2"/><rect x="30" y="3" width="4" height="9" rx="2"/><rect x="39" y="3" width="4" height="9" rx="2"/><rect x="21" y="52" width="4" height="9" rx="2"/><rect x="30" y="52" width="4" height="9" rx="2"/><rect x="39" y="52" width="4" height="9" rx="2"/><rect x="3" y="21" width="9" height="4" rx="2"/><rect x="3" y="30" width="9" height="4" rx="2"/><rect x="3" y="39" width="9" height="4" rx="2"/><rect x="52" y="21" width="9" height="4" rx="2"/><rect x="52" y="30" width="9" height="4" rx="2"/><rect x="52" y="39" width="9" height="4" rx="2"/></g><rect class="body" x="12" y="12" width="40" height="40" rx="7"/><path class="chev" d="M22 23l11 9-11 9" fill="none" stroke-width="4.5"/><rect x="35" y="39" width="11" height="4.5" fill="#f97316"/></svg>
  <span>mini<b>esp</b></span></a>
 <nav class="mtabs" aria-label="Console">
  <a href="/#machine"><svg class="ic"><use href="#i-server"/></svg>Machine</a>
  <a href="/#services"><svg class="ic"><use href="#i-activity"/></svg>Services</a>
  <a href="/#apps" aria-current="page"><svg class="ic"><use href="#i-package"/></svg>Apps</a>
 </nav>
</div></header>
<main class="wrap">
<div class="login card">
 <div class="mark"><svg class="ic" style="width:32px;height:32px;color:var(--acc)"><use href="#i-droplet"/></svg></div>
 <h1 id="t">Sign in</h1><div class="sub" id="s">Water tank controller</div>
 <form id="f" autocomplete="on" style="margin-top:14px">
  <input type="text" name="username" value="tank" autocomplete="username" hidden>
  <div class="row" style="grid-template-columns:1fr"><label for="pw" id="l1">Password</label><input id="pw" type="password" autocomplete="current-password" required autofocus></div>
  <div class="row" id="r2" style="grid-template-columns:1fr;display:none"><label for="pw2">Repeat password</label><input id="pw2" type="password" autocomplete="new-password"></div>
  <button class="b" id="go" style="width:100%;margin-top:8px">Sign in</button>
  <div class="msg" id="m"></div>
 </form>
 <p class="sub"><a href="index.html" style="color:var(--acc)">View dashboard without signing in</a><br>Unencrypted (HTTP): use only on your own network.</p>
</div></main>
<script src="tank.js"></script>
<script>
T.noRedirect=true; let setup=false;
const next=new URLSearchParams(location.search).get('next')||'index.html';
const dest=/^[a-z0-9_.-]+$/i.test(next)?next:'index.html';
(async()=>{
  if(await T.loggedIn()){location.href=dest;return}
  try{const r=await T.raw(['web','status'],3); if(r.pw===false){setup=true;$('t').textContent='Create a password';$('s').textContent='First start: choose a password (6+ characters) for this controller.';$('l1').textContent='New password';$('pw').autocomplete='new-password';$('r2').style.display='';$('pw2').required=true;$('go').textContent='Create password'}}
  catch(e){$('m').textContent=e.message;$('m').className='msg e'}
})();
$('f').onsubmit=async ev=>{
  ev.preventDefault(); const m=$('m'); m.className='msg'; m.textContent='';
  const pw=$('pw').value;
  if(setup){ if(pw.length<6){m.textContent='Use at least 6 characters.';m.className='msg e';return} if(pw!==$('pw2').value){m.textContent='The passwords do not match.';m.className='msg e';return} }
  $('go').disabled=true; m.textContent='Checking…';
  try{
    const r=await T.raw(['web',setup?'setup':'login',T.hex(pw)]);
    if(r.ok){T.setTok(r.token);location.href=dest;return}
    m.textContent=r.error==='bad'?'Wrong password.':r.error==='nopw'?'No password set yet: reload this page.':r.error==='exists'?'A password already exists: reload this page.':'Failed: '+(r.error||'');m.className='msg e';
  }catch(e){m.textContent=e.message;m.className='msg e'}
  $('go').disabled=false;
};
</script></body></html>
